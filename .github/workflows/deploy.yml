name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy universecrm-landing to Cloudflare Pages
        run: wrangler pages deploy public --project-name=universecrm-landing --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-crm-app:
    runs-on: ubuntu-latest
    name: Deploy CRM App to spectrum-universe
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build deploy directory
        run: |
          mkdir -p _deploy
          cp index.html _deploy/
          cp -r assets _deploy/
          cp -r functions _deploy/ 2>/dev/null || true
          cp favicon.png _deploy/ 2>/dev/null || true
          cp spectrum-logo.png _deploy/ 2>/dev/null || true
          cp div-*.png _deploy/ 2>/dev/null || true
          cp logo-*.jpg _deploy/ 2>/dev/null || true

      - name: Deploy CRM to Cloudflare Pages
        run: wrangler pages deploy _deploy --project-name=spectrum-universe --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-supabase-functions:
    runs-on: ubuntu-latest
    name: Deploy Supabase Edge Functions
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy website-lead function
        run: |
          supabase functions deploy website-lead \
            --project-ref tplkmtmuoyslmjewcudk \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
