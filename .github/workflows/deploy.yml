name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-crm-app:
    runs-on: ubuntu-latest
    name: Deploy CRM App to spectrum-universe
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy CRM to Cloudflare Pages
        run: wrangler pages deploy _deploy --project-name=spectrum-universe --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  run-migrations:
    runs-on: ubuntu-latest
    name: Run DB Migrations
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migrations
        run: |
          if [ -f supabase/migrations/add_apollo_id.sql ]; then
            supabase db execute --project-ref tplkmtmuoyslmjewcudk \
              --file supabase/migrations/add_apollo_id.sql || echo "Migration already applied or command not supported"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-supabase-functions:
    runs-on: ubuntu-latest
    name: Deploy Supabase Edge Functions
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy website-lead function
        run: |
          supabase functions deploy website-lead \
            --project-ref tplkmtmuoyslmjewcudk \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
